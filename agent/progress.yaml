notes:
  - Following remember-mcp pattern (static configuration, no tokenResolver)
  - Using @prmichaelsen/mcp-auth for multi-tenant mode (optional)
  - OpenWeatherMap One Call API 3.0 integration
  - Static API key configuration via environment variables
  - Support both stdio (standalone) and SSE (multi-tenant) transports
  - Implement response caching to reduce API calls
  - Keep dependencies minimal for maintainability

