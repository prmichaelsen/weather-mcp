dependencies:
  external_services:
    - name: OpenWeatherMap One Call API 3.0
      status: active
      notes: |
        Primary weather data source. Requires API key from openweathermap.org.
        Free tier: 1,000 calls/day. Rate limiting and caching required.
  
  libraries:
    - name: "@modelcontextprotocol/sdk"
      version: "^1.0.4"
      purpose: |
        MCP protocol implementation
    
    - name: "@prmichaelsen/mcp-auth"
      version: "^7.0.4"
      purpose: |
        Multi-tenant authentication wrapper (optional, for SSE mode)
    
    - name: "dotenv"
      version: "^16.4.5"
      purpose: |
        Environment variable management
    
    - name: "typescript"
      version: "^5.7.2"
      purpose: |
        Type safety and compilation
    
    - name: "esbuild"
      version: "^0.25.0"
      purpose: |
        Fast bundling for production
  
  infrastructure:
    - name: OpenWeatherMap Account
      status: required
      notes: |
        Free or paid account required. API key must be configured in .env file.

